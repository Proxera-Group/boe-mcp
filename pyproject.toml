[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boe-mcp-es"
version = "0.1.0"
description = "Servidor MCP para consultar el BOE (sumarios, legislación consolidada, disposiciones) desde Claude. Pensado para gestorías, asesorías y despachos de abogados de España."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Proxera AI Solutions Group S.L.", email = "info@proxera.es" }]
keywords = ["mcp", "boe", "españa", "legislación", "gestoría", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boe-mcp = "boe_mcp.server:main"
boe-mcp-es = "boe_mcp.server:main"  # permite `uvx boe-mcp-es` sin --from

[project.urls]
Homepage = "https://proxera.es"
Repository = "https://github.com/Proxera-Group/boe-mcp"
Issues = "https://github.com/Proxera-Group/boe-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/boe_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
